<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hook Check</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   NOTION BACKGROUND
========================================================= */

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #ffffff;
}

@media (prefers-color-scheme: dark) {
    html,
    body {
        background: #191919;
    }
}

/* =========================================================
   OUTER COMPOSITION
   613 × 447
========================================================= */

* {
    box-sizing: border-box;
}

.hook-check-outer {
    position: relative;
    width: 100%;
    max-width: 613px;
    margin: 0 auto;

    aspect-ratio: 613 / 447;

    background-image: url("background.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    overflow: hidden;
}

/* =========================================================
   INNER WIDGET
   541 × 375
   Percentage positioning preserves frame on mobile.
========================================================= */

.hook-check-inner {
    position: absolute;

    left: 5.873%;
    right: 5.873%;
    top: 8.054%;
    bottom: 8.054%;

    background: #0b3426;
    color: #f3e8d5;

    overflow: hidden;

    border: 1px solid rgba(212, 175, 55, 0.28);

    font-family: "Inter", sans-serif;
}

/* =========================================================
   APP CONTAINER
========================================================= */

.app {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;

    scrollbar-width: thin;
    scrollbar-color: rgba(212,175,55,.35) transparent;
}

.app::-webkit-scrollbar {
    width: 5px;
}

.app::-webkit-scrollbar-track {
    background: transparent;
}

.app::-webkit-scrollbar-thumb {
    background: rgba(212,175,55,.35);
}

/* =========================================================
   SCREEN
========================================================= */

.screen {
    min-height: 100%;
    padding: clamp(20px, 4vw, 30px);
}

/* =========================================================
   HEADER
========================================================= */

.eyebrow {
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #d4af37;
    font-weight: 700;
    margin-bottom: 5px;
}

.title {
    margin: 0;
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(28px, 5vw, 38px);
    line-height: .9;
    font-weight: 600;
    letter-spacing: -.5px;
}

.subtitle {
    margin: 8px 0 0;
    color: rgba(243,232,213,.7);
    font-size: 10px;
    line-height: 1.5;
    max-width: 390px;
}

/* =========================================================
   INPUT AREA
========================================================= */

.form-section {
    margin-top: 17px;
}

.label {
    display: block;
    margin-bottom: 6px;

    font-size: 8px;
    letter-spacing: 1.5px;
    text-transform: uppercase;

    color: rgba(243,232,213,.7);
    font-weight: 700;
}

textarea {
    width: 100%;
    min-height: 82px;
    resize: vertical;

    padding: 11px 12px;

    border: 1px solid rgba(243,232,213,.18);
    border-radius: 5px;

    background: #123f30;
    color: #f3e8d5;

    font-family: "Inter", sans-serif;
    font-size: 11px;
    line-height: 1.5;

    outline: none;

    transition: border-color .2s ease;
}

textarea::placeholder {
    color: rgba(243,232,213,.38);
}

textarea:focus {
    border-color: rgba(212,175,55,.65);
}

/* =========================================================
   GOAL SELECTORS
========================================================= */

.goal-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
}

.goal-btn {
    min-width: 0;

    padding: 8px 4px;

    border: 1px solid rgba(243,232,213,.14);
    border-radius: 4px;

    background: #123f30;
    color: rgba(243,232,213,.75);

    cursor: pointer;

    font-family: "Inter", sans-serif;
    font-size: 8px;
    font-weight: 600;

    transition:
        background .18s ease,
        color .18s ease,
        border-color .18s ease,
        transform .18s ease;
}

.goal-btn:hover {
    border-color: rgba(212,175,55,.5);
    color: #f3e8d5;
}

.goal-btn.active {
    background: rgba(212,175,55,.13);
    border-color: #d4af37;
    color: #f3e8d5;
}

.goal-icon {
    display: block;
    font-size: 13px;
    margin-bottom: 3px;
}

.goal-name {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================================================
   PRIMARY BUTTON
========================================================= */

.primary-btn {
    width: 100%;
    margin-top: 12px;

    padding: 11px 14px;

    border: 1px solid #d4af37;
    border-radius: 4px;

    background: #d4af37;
    color: #0b3426;

    font-family: "Inter", sans-serif;
    font-size: 9px;
    font-weight: 800;

    letter-spacing: 1.4px;
    text-transform: uppercase;

    cursor: pointer;

    transition:
        background .18s ease,
        color .18s ease,
        transform .18s ease;
}

.primary-btn:hover {
    background: #f0d77a;
}

.primary-btn:active {
    transform: scale(.99);
}

.primary-btn:disabled {
    opacity: .4;
    cursor: not-allowed;
}

/* =========================================================
   RESULTS
========================================================= */

.results-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;

    margin-bottom: 15px;
}

.results-title {
    margin: 0;

    font-family: "Cormorant Garamond", serif;
    font-size: clamp(26px, 5vw, 34px);
    line-height: .95;
    font-weight: 600;
}

.overall {
    flex-shrink: 0;

    padding: 7px 9px;

    border: 1px solid rgba(212,175,55,.4);
    background: rgba(212,175,55,.08);

    text-align: center;
}

.overall-score {
    display: block;
    font-size: 17px;
    font-weight: 700;
    color: #d4af37;
}

.overall-label {
    display: block;
    margin-top: 1px;

    font-size: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;

    color: rgba(243,232,213,.55);
}

/* =========================================================
   FACTOR CARDS
========================================================= */

.factor-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
}

.factor-card {
    padding: 9px;

    border: 1px solid rgba(243,232,213,.11);
    border-radius: 4px;

    background: #123f30;
}

.factor-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 5px;
}

.factor-name {
    font-size: 8px;
    font-weight: 700;
}

.status {
    font-size: 6px;
    letter-spacing: .6px;
    text-transform: uppercase;
    font-weight: 700;
}

.status.strong {
    color: #b7d7bd;
}

.status.medium {
    color: #e2c978;
}

.status.weak {
    color: #d99b8f;
}

.factor-description {
    margin-top: 5px;

    color: rgba(243,232,213,.58);

    font-size: 7px;
    line-height: 1.4;
}

.meter {
    height: 3px;
    margin-top: 7px;

    background: rgba(243,232,213,.09);
    overflow: hidden;
}

.meter-fill {
    height: 100%;
    background: #d4af37;
}

/* =========================================================
   FEEDBACK
========================================================= */

.feedback-section {
    margin-top: 12px;
}

.feedback-card {
    padding: 11px;

    margin-bottom: 7px;

    border-left: 2px solid #d4af37;

    background: rgba(18,63,48,.8);
}

.feedback-heading {
    margin-bottom: 5px;

    font-size: 8px;
    letter-spacing: .8px;
    text-transform: uppercase;
    font-weight: 800;
}

.feedback-text {
    color: rgba(243,232,213,.72);

    font-size: 8px;
    line-height: 1.5;
}

/* =========================================================
   IMPROVED HOOKS
========================================================= */

.improved-heading {
    margin: 14px 0 7px;

    font-family: "Cormorant Garamond", serif;
    font-size: 20px;
    font-weight: 600;
}

.hook-option {
    padding: 9px 10px;
    margin-bottom: 6px;

    border: 1px solid rgba(212,175,55,.18);
    background: #123f30;
}

.option-label {
    margin-bottom: 4px;

    font-size: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;

    color: #d4af37;
    font-weight: 800;
}

.option-text {
    font-size: 8px;
    line-height: 1.45;
    color: #f3e8d5;
}

/* =========================================================
   RESET
========================================================= */

.reset-btn {
    width: 100%;

    margin-top: 8px;
    padding: 9px;

    background: transparent;

    border: 1px solid rgba(243,232,213,.18);
    border-radius: 4px;

    color: rgba(243,232,213,.7);

    font-family: "Inter", sans-serif;
    font-size: 8px;
    font-weight: 700;

    cursor: pointer;

    transition: all .18s ease;
}

.reset-btn:hover {
    border-color: #d4af37;
    color: #d4af37;
}

/* =========================================================
   EMPTY / ERROR
========================================================= */

.error {
    margin-top: 7px;

    color: #d99b8f;

    font-size: 8px;
}

/* =========================================================
   SMALL WIDTH ADJUSTMENTS
========================================================= */

@media (max-width: 430px) {

    .screen {
        padding: 18px;
    }

    .goal-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 3px;
    }

    .goal-btn {
        padding: 7px 2px;
        font-size: 6.5px;
    }

    .goal-icon {
        font-size: 11px;
    }

    .factor-grid {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 320px) {

    .screen {
        padding: 14px;
    }

    .title {
        font-size: 27px;
    }

    .goal-icon {
        font-size: 10px;
    }

    .goal-btn {
        font-size: 6px;
    }

    .factor-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="hook-check-outer">

    <div class="hook-check-inner">

        <div class="app" id="app"></div>

    </div>

</div>


<script>
/* =========================================================
   HOOK CHECK
   Deterministic client-side hook analysis
========================================================= */

const GOALS = {
    reach: {
        icon: "🔥",
        name: "Reach",
        priorities: ["curiosity", "novelty", "surprise", "pattern", "emotion"]
    },

    saves: {
        icon: "💾",
        name: "Saves",
        priorities: ["usefulness", "specificity", "actionable", "payoff"]
    },

    comments: {
        icon: "💬",
        name: "Comments",
        priorities: ["opinion", "question", "debate", "relatable"]
    },

    sales: {
        icon: "🛒",
        name: "Sales",
        priorities: ["problem", "benefit", "transformation", "product", "outcome"]
    },

    authority: {
        icon: "👑",
        name: "Authority",
        priorities: ["expertise", "specificity", "opinion", "insight", "credibility"]
    }
};

let selectedGoal = null;

// Initialize on load
window.addEventListener("DOMContentLoaded", () => {
    renderInitial();
});


/* =========================================================
   INITIAL SCREEN
========================================================= */

function renderInitial() {
    document.getElementById("app").innerHTML = `
        <div class="screen">

            <div class="eyebrow">Content Strategy Utility</div>

            <h1 class="title">Hook Check</h1>

            <p class="subtitle">
                Paste your hook and I'll break down what's working,
                what's weak, and how to make it stronger.
            </p>

            <div class="form-section">

                <label class="label">Your Hook</label>

                <textarea
                    id="hookInput"
                    placeholder="Paste your hook here…"
                    maxlength="500"
                ></textarea>

            </div>


            <div class="form-section">

                <label class="label">What's Your Goal?</label>

                <div class="goal-grid">

                    ${Object.entries(GOALS).map(([key, goal]) => `
                        <button
                            class="goal-btn ${selectedGoal === key ? 'active' : ''}"
                            data-goal="${key}"
                            onclick="selectGoal('${key}')"
                        >
                            <span class="goal-icon">${goal.icon}</span>
                            <span class="goal-name">${goal.name}</span>
                        </button>
                    `).join("")}

                </div>

            </div>


            <button
                class="primary-btn"
                id="analyzeBtn"
                onclick="analyzeHook()"
            >
                Analyze Hook
            </button>

            <div id="error" class="error"></div>

        </div>
    `;
}


/* =========================================================
   GOAL SELECTION
========================================================= */

function selectGoal(goal) {
    selectedGoal = goal;

    document.querySelectorAll(".goal-btn").forEach(btn => {
        btn.classList.toggle(
            "active",
            btn.dataset.goal === goal
        );
    });
}


/* =========================================================
   NORMALIZATION
========================================================= */

function normalize(text) {
    return text
        .toLowerCase()
        .replace(/[“”‘’]/g, "'")
        .replace(/[^\w\s₹$%!?.,'’-]/gi, " ")
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   PATTERN LIBRARY
========================================================= */

const PATTERNS = {

    curiosity: [
        /\bwhy\b/,
        /\bhow\b/,
        /\bwhat\b/,
        /\bthe reason\b/,
        /\bhere's why\b/,
        /\bnobody tells you\b/,
        /\bno one tells you\b/,
        /\bi stopped\b/,
        /\bi quit\b/,
        /\bi wish i knew\b/,
        /\bi didn't expect\b/,
        /\bi was wrong\b/,
        /\bturns out\b/,
        /\bsecret\b/,
        /\btruth\b/,
        /\bmistake\b/,
        /\bmistakes\b/,
        /\bsurprisingly\b/,
        /\bbut\b/,
        /\binstead\b/,
        /\buntil\b/,
        /\bbefore\b/,
        /\bafter\b/,
        /\bvs\b/,
        /\bversus\b/,
        /\breal reason\b/
    ],

    surprise: [
        /\bactually\b/,
        /\bbut\b/,
        /\bnot\b/,
        /\bnever\b/,
        /\bwrong\b/,
        /\bunexpected\b/,
        /\bsurprising\b/,
        /\bshocked\b/,
        /\bturns out\b/,
        /\bmost people\b/,
        /\beveryone\b/,
        /\bnobody\b/,
        /\bno one\b/
    ],

    questions: [
        /\?/,
        /^(why|how|what|when|where|which|who)\b/
    ],

    numbers: [
        /\b\d+\b/,
        /\b\d+%\b/,
        /₹\s?\d+/,
        /\$\s?\d+/,
        /\b\d+\s?(days?|weeks?|months?|years?|hours?|minutes?)\b/
    ],

    timeframes: [
        /\b\d+\s?(days?|weeks?|months?|years?|hours?|minutes?)\b/,
        /\btoday\b/,
        /\bthis week\b/,
        /\bthis month\b/,
        /\bovernight\b/,
        /\bin \d+\b/
    ],

    audience: [
        /\bfor women\b/,
        /\bfor men\b/,
        /\bfor creators\b/,
        /\bfor founders\b/,
        /\bfor entrepreneurs\b/,
        /\bfor students\b/,
        /\bfor beginners\b/,
        /\bfor small businesses\b/,
        /\bfor business owners\b/,
        /\bif you're\b/,
        /\bif you are\b/,
        /\bif your\b/,
        /\bpeople with\b/
    ],

    outcomes: [
        /\bget\b/,
        /\bsave\b/,
        /\bmake\b/,
        /\bgrow\b/,
        /\bincrease\b/,
        /\breduce\b/,
        /\blose\b/,
        /\bgain\b/,
        /\bbuild\b/,
        /\bavoid\b/,
        /\bfix\b/,
        /\bimprove\b/,
        /\blook\b/,
        /\bfeel\b/,
        /\bearn\b/,
        /\bboost\b/,
        /\bbetter\b/,
        /\bmore\b/,
        /\bless\b/
    ],

    problems: [
        /\bproblem\b/,
        /\bstruggle\b/,
        /\bstruggling\b/,
        /\bmistake\b/,
        /\bmistakes\b/,
        /\bwrong\b/,
        /\bfail\b/,
        /\bfailing\b/,
        /\bbroke\b/,
        /\bexpensive\b/,
        /\bwaste\b/,
        /\bwasting\b/,
        /\bconfused\b/,
        /\bconfusion\b/,
        /\bfrustrated\b/,
        /\bfrustrating\b/,
        /\bcan't\b/,
        /\bcannot\b/,
        /\bavoid\b/,
        /\bkeep\b/,
        /\bkeeping\b/
    ],

    opinions: [
        /\bi think\b/,
        /\bi believe\b/,
        /\bhot take\b/,
        /\bunpopular opinion\b/,
        /\bcontroversial\b/,
        /\bmy opinion\b/,
        /\bi disagree\b/,
        /\byou don't need\b/,
        /\bstop\b/,
        /\bshouldn't\b/,
        /\boverrated\b/,
        /\bunderrated\b/
    ],

    debate: [
        /\breally\b/,
        /\bactually\b/,
        /\bwrong\b/,
        /\bcontroversial\b/,
        /\bunpopular\b/,
        /\bdisagree\b/,
        /\bvs\b/,
        /\bversus\b/,
        /\bshould\b/,
        /\bshouldn't\b/
    ],

    product: [
        /\bproduct\b/,
        /\bproducts\b/,
        /\btool\b/,
        /\btools\b/,
        /\bapp\b/,
        /\bapps\b/,
        /\bbrand\b/,
        /\bbrands\b/,
        /\bskincare\b/,
        /\bmakeup\b/,
        /\bcourse\b/,
        /\bsoftware\b/,
        /\bservice\b/,
        /\bservices\b/
    ],

    credibility: [
        /\byears?\b/,
        /\bmonths?\b/,
        /\bclients?\b/,
        /\bcustomers?\b/,
        /\bexperience\b/,
        /\btested\b/,
        /\btesting\b/,
        /\bused\b/,
        /\bworked\b/,
        /\bresults?\b/,
        /\bcase study\b/,
        /\bdata\b/,
        /\bresearch\b/
    ],

    actionable: [
        /\bhow to\b/,
        /\bstep\b/,
        /\bsteps\b/,
        /\btips?\b/,
        /\bways?\b/,
        /\bmistakes?\b/,
        /\brules?\b/,
        /\bchecklist\b/,
        /\bframework\b/,
        /\bstrategy\b/,
        /\btemplate\b/,
        /\bguide\b/,
        /\bthings?\b/
    ]
};


/* =========================================================
   UTILITY FUNCTIONS
========================================================= */

function matchesAny(text, patterns) {
    return patterns.some(pattern => pattern.test(text));
}

function getWords(text) {
    return text.split(/\s+/).filter(Boolean);
}

function hasSpecificity(text) {
    const wordCount = getWords(text).length;

    return {
        number: matchesAny(text, PATTERNS.numbers),
        timeframe: matchesAny(text, PATTERNS.timeframes),
        audience: matchesAny(text, PATTERNS.audience),
        outcome: matchesAny(text, PATTERNS.outcomes),
        problem: matchesAny(text, PATTERNS.problems),
        product: matchesAny(text, PATTERNS.product),
        credibility: matchesAny(text, PATTERNS.credibility),
        category: wordCount >= 5
    };
}

function clamp(number, min, max) {
    return Math.min(Math.max(number, min), max);
}


/* =========================================================
   ANALYSIS EXECUTION
========================================================= */

function analyzeHook() {
    const hookInput = document.getElementById("hookInput");
    const errorEl = document.getElementById("error");
    const text = hookInput ? hookInput.value.trim() : "";

    if (!text) {
        errorEl.textContent = "Please paste or type a hook to analyze.";
        return;
    }

    if (!selectedGoal) {
        errorEl.textContent = "Please select a goal for your hook.";
        return;
    }

    errorEl.textContent = "";

    const scores = analyzeFactors(text, selectedGoal);
    const overallScore = Math.round(
        (scores.curiosity + scores.specificity + scores.payoff + scores.clarity + scores.scroll) / 5
    );

    renderResults(text, selectedGoal, scores, overallScore);
}


/* =========================================================
   FACTOR ANALYSIS
========================================================= */

function analyzeFactors(originalText, goal) {
    const text = normalize(originalText);
    const words = getWords(text);
    const specificity = hasSpecificity(text);

    let curiosity = 25;
    if (matchesAny(text, PATTERNS.questions)) curiosity += 22;
    if (matchesAny(text, PATTERNS.curiosity)) curiosity += 20;
    if (matchesAny(text, PATTERNS.surprise)) curiosity += 15;
    if (/\b\d+\b/.test(text)) curiosity += 5;
    if (/\bbut\b|\bhowever\b|\binstead\b/.test(text)) curiosity += 10;
    curiosity = clamp(curiosity, 10, 96);

    let specificityScore = 20;
    if (specificity.number) specificityScore += 18;
    if (specificity.timeframe) specificityScore += 10;
    if (specificity.audience) specificityScore += 13;
    if (specificity.outcome) specificityScore += 12;
    if (specificity.problem) specificityScore += 10;
    if (specificity.product) specificityScore += 5;
    if (specificity.credibility) specificityScore += 7;
    if (specificity.category) specificityScore += 5;
    if (words.length < 4) specificityScore -= 10;
    specificityScore = clamp(specificityScore, 8, 96);

    let payoff = 28;
    if (specificity.outcome) payoff += 18;
    if (specificity.problem) payoff += 13;
    if (matchesAny(text, PATTERNS.actionable)) payoff += 15;
    if (specificity.number) payoff += 6;
    if (specificity.audience) payoff += 5;
    payoff = clamp(payoff, 10, 96);

    let clarity = 85;
    if (words.length > 25) clarity -= 20;
    if (words.length < 3) clarity -= 18;
    clarity = clamp(clarity, 15, 98);

    let scroll = 28;
    if (matchesAny(text, PATTERNS.questions)) scroll += 15;
    if (matchesAny(text, PATTERNS.surprise)) scroll += 16;
    if (matchesAny(text, PATTERNS.curiosity)) scroll += 15;
    if (matchesAny(text, PATTERNS.problems)) scroll += 10;
    scroll = clamp(scroll, 10, 97);

    const goalAdjustments = {
        reach: { curiosity: 1.08, specificity: .92, payoff: .92, clarity: .95, scroll: 1.10 },
        saves: { curiosity: .90, specificity: 1.12, payoff: 1.12, clarity: 1.0, scroll: .90 },
        comments: { curiosity: 1.0, specificity: .95, payoff: .90, clarity: .95, scroll: 1.0 },
        sales: { curiosity: .95, specificity: 1.02, payoff: 1.15, clarity: 1.05, scroll: .95 },
        authority: { curiosity: .90, specificity: 1.12, payoff: 1.0, clarity: 1.05, scroll: .95 }
    };

    const adjust = goalAdjustments[goal];

    return {
        curiosity: clamp(Math.round(curiosity * adjust.curiosity), 10, 98),
        specificity: clamp(Math.round(specificityScore * adjust.specificity), 10, 98),
        payoff: clamp(Math.round(payoff * adjust.payoff), 10, 98),
        clarity: clamp(Math.round(clarity * adjust.clarity), 10, 98),
        scroll: clamp(Math.round(scroll * adjust.scroll), 10, 98)
    };
}


/* =========================================================
   STATUS & EXPLANATIONS
========================================================= */

function getStatus(score) {
    if (score >= 72) return { label: "Strong", className: "strong" };
    if (score >= 48) return { label: "Could Improve", className: "medium" };
    return { label: "Weak", className: "weak" };
}

function factorExplanation(name, score) {
    const status = getStatus(score);
    const explanations = {
        curiosity: {
            strong: "The hook creates a compelling reason to keep watching through tension or an information gap.",
            medium: "There is some reason to continue, but it could create a sharper unresolved tension.",
            weak: "The topic is stated, but leaves little unanswered mystery for the viewer."
        },
        specificity: {
            strong: "Contains concrete details like a number, audience, problem, or timeframe.",
            medium: "Somewhat defined, but one more concrete detail would enhance it.",
            weak: "Too broad. Add a concrete number, timeframe, or specific scenario."
        },
        payoff: {
            strong: "Clearly communicates what useful result or insight the viewer will receive.",
            medium: "The topic is clear, but the viewer has to infer the personal benefit.",
            weak: "Make the explicit benefit or transformation immediately clear."
        },
        clarity: {
            strong: "The core idea is easily understood without unnecessary clutter.",
            medium: "Main idea works, but tightening the phrasing will help readability.",
            weak: "Wording is vague or tangled. Simplify for instant comprehension."
        },
        scroll: {
            strong: "Contains strong pattern-interrupt elements to stop mindless scrolling.",
            medium: "Has some stopping power, but could use a sharper claim or contrast.",
            weak: "Resembles a generic intro. Inject surprise, tension, or a bold stance."
        }
    };
    return explanations[name][status.className];
}

function goalFeedback(text, goal, scores) {
    if (goal === 'reach' && scores.curiosity < 55) {
        return "For Reach, focus on widening the curiosity gap so viewers want to see what follows.";
    }
    if (goal === 'saves' && scores.specificity < 60) {
        return "For Saves, make the practical takeaway or actionable framework crystal clear.";
    }
    return `This hook is structured reasonably well to support your target goal of ${GOALS[goal].name}.`;
}


/* =========================================================
   IMPROVED HOOK GENERATION
========================================================= */

function generateHooks(original, goal) {
    const cleaned = original.trim();
    let baseTopic = cleaned.replace(/^[.!?]+$/, "").trim();
    if (!baseTopic) baseTopic = "this topic";

    return [
        { label: "Curiosity Angle", text: `I used to think standard approaches worked, until I discovered this one shift about ${baseTopic}.` },
        { label: "Direct Benefit Angle", text: `How to master ${baseTopic} without making the common mistakes everyone repeats.` },
        { label: "Authority Angle", text: `After testing multiple strategies regarding ${baseTopic}, here is what actually moves the needle.` }
    ];
}


/* =========================================================
   RENDER RESULTS SCREEN
========================================================= */

function renderResults(originalText, goal, scores, overallScore) {
    const factors = [
        { key: "curiosity", name: "Curiosity Gap", score: scores.curiosity },
        { key: "specificity", name: "Specificity", score: scores.specificity },
        { key: "payoff", name: "Value Payoff", score: scores.payoff },
        { key: "clarity", name: "Clarity", score: scores.clarity },
        { key: "scroll", name: "Scroll-Stop", score: scores.scroll }
    ];

    const improved = generateHooks(originalText, goal);

    document.getElementById("app").innerHTML = `
        <div class="screen">
            <div class="results-header">
                <div>
                    <div class="eyebrow">Analysis Complete • ${GOALS[goal].icon} ${GOALS[goal].name}</div>
                    <h2 class="results-title">Hook Breakdown</h2>
                </div>
                <div class="overall">
                    <span class="overall-score">${overallScore}</span>
                    <span class="overall-label">Score</span>
                </div>
            </div>

            <div class="factor-grid">
                ${factors.map(f => {
                    const st = getStatus(f.score);
                    return `
                        <div class="factor-card">
                            <div class="factor-top">
                                <span class="factor-name">${f.name}</span>
                                <span class="status ${st.className}">${st.label}</span>
                            </div>
                            <div class="meter">
                                <div class="meter-fill" style="width: ${f.score}%"></div>
                            </div>
                            <div class="factor-description">${factorExplanation(f.key, f.score)}</div>
                        </div>
                    `;
                }).join("")}
            </div>

            <div class="feedback-section">
                <div class="feedback-card">
                    <div class="feedback-heading">Strategic Feedback</div>
                    <div class="feedback-text">${goalFeedback(originalText, goal, scores)}</div>
                </div>

                <div class="improved-heading">Refined Variations</div>
                ${improved.map(item => `
                    <div class="hook-option">
                        <div class="option-label">${item.label}</div>
                        <div class="option-text">${item.text}</div>
                    </div>
                `).join("")}
            </div>

            <button class="reset-btn" onclick="renderInitial()">Test Another Hook</button>
        </div>
    `;
}
</script>
</body>
</html>
